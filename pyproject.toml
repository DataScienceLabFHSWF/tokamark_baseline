[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokamark-baseline"
version = "0.1.0"
description = "Deep learning baseline for the TokaMark benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "torch>=2.2",
  "torchinfo==1.8.0",
  "line-profiler==5.0.2",
]

[tool.setuptools]
py-modules = ["globals", "utils", "run_training", "run_evaluation"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]